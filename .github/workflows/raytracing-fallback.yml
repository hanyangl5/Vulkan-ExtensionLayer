name: Ray tracing fallback components
on:
  push:
    paths: ['layers/raytracing/**', 'CMakeLists.txt', 'README.md', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
  pull_request:
    paths: ['layers/raytracing/**', 'CMakeLists.txt', 'README.md', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test portable BVH4 reference
        run: |
          cmake -S layers/raytracing/bvh4 -B build-bvh4 -DCMAKE_BUILD_TYPE=Debug -DVEL_RT_BVH4_SANITIZERS=ON
          cmake --build build-bvh4 --parallel
          ctest --test-dir build-bvh4 --output-on-failure
      - name: Install build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-dev glslang-tools glslc spirv-tools spirv-headers
      - name: Test shared BVH4 GPU encoding without native RT
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          export VEL_RT_BVH4_VALIDATION=1
          cmake -S layers/raytracing/bvh4 -B build-bvh4 -DVEL_RT_BVH4_GPU_TESTS=ON
          cmake --build build-bvh4 --parallel
          ctest --test-dir build-bvh4 --output-on-failure
      - name: Configure canonical typed components
        run: cmake -S layers/raytracing -B build-rt -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build canonical layer and typed components
        run: cmake --build build-rt --parallel 2
      - name: Test canonical typed components on Lavapipe
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir build-rt -R '^ray_tracing_fallback_' --output-on-failure
