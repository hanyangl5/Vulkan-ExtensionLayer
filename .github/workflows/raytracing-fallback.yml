name: Ray tracing fallback
on:
  push:
    paths: ['layers/raytracing/**', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
  pull_request:
    paths: ['layers/raytracing/**', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev mesa-vulkan-drivers glslang-dev glslang-tools spirv-tools libspirv-cross-c-shared-dev
      - name: Configure
        run: cmake -S layers/raytracing -B build-rt -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-rt
      - name: Test the compute path on Lavapipe
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir build-rt --output-on-failure
