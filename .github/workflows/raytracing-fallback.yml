name: Ray tracing fallback
on:
  push:
    paths: ['layers/raytracing/**', 'layers/common/rt_fallback/**', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
  pull_request:
    paths: ['layers/raytracing/**', 'layers/common/rt_fallback/**', 'docs/ray_tracing_fallback*.md', '.github/workflows/raytracing-fallback.yml']
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test portable BVH4 reference
        run: |
          cmake -S layers/common/rt_fallback -B build-bvh4 -DCMAKE_BUILD_TYPE=Debug -DVEL_RT_BVH4_SANITIZERS=ON
          cmake --build build-bvh4 --parallel
          ctest --test-dir build-bvh4 --output-on-failure
      - name: Install build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-dev glslang-tools spirv-tools libspirv-cross-c-shared-dev
      - name: Configure
        run: cmake -S layers/raytracing -B build-rt -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-rt
      - name: Test the compute path on Lavapipe
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir build-rt --output-on-failure
      - name: Validate lowered builder, refit and material dispatch
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export VK_LAYER_PATH="$PWD/build-rt:/usr/share/vulkan/explicit_layer.d"
          export VEL_RT_TEST_VALIDATION=1
          for variant in builder metadata tlas; do ./build-rt/vel_rt_tests "$variant"; done
