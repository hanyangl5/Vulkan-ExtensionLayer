# SPDX-License-Identifier: MIT
name: Ray tracing fallback layer

on:
  push:
    paths:
      - 'layers/raytracing/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/run_rt_cts.py'
      - 'scripts/test_rt_cts_guard_evidence.py'
      - 'scripts/test_debug_cts_startup.py'
      - '.github/workflows/rayquery-fallback.yml'
  pull_request:
    paths:
      - 'layers/raytracing/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/run_rt_cts.py'
      - 'scripts/test_rt_cts_guard_evidence.py'
      - 'scripts/test_debug_cts_startup.py'
      - '.github/workflows/rayquery-fallback.yml'

permissions:
  contents: read

jobs:
  standalone-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install standalone build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 libvulkan-dev \
            spirv-tools spirv-headers glslc glslang-dev mesa-vulkan-drivers
      # Preserve newer native feature chains without raising the backend feature floor.
      - name: Check out matching Vulkan headers and registry
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 73814d006638aa00bd553215b054f0f02e457e22 # v1.4.366
          path: .ci/Vulkan-Headers
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S layers/raytracing -B build-raytracing -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DVulkan_INCLUDE_DIR="$GITHUB_WORKSPACE/.ci/Vulkan-Headers/include"
          -DVKRT_VULKAN_REGISTRY="$GITHUB_WORKSPACE/.ci/Vulkan-Headers/registry/vk.xml"
      - name: Build layer, tests and validated SPIR-V
        run: cmake --build build-raytracing --parallel 2
      - name: Run offline tests
        run: ctest --test-dir build-raytracing -L offline --output-on-failure
      - name: Run software Vulkan tests without native RT
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ctest --test-dir build-raytracing -L no_native_rt --output-on-failure
